<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/desktop.css">
</head>
<body>
    <main>
        <section id="login">
            <div id="image">
            </div>
            <div id="form">
                <h1>Login</h1>
                <p>Seja bem-vindo (a) novamente. Faça log-in para acessar sua conta e poder fazer as configurações no seu ambiente.</p>
                <form method="post">
                    <div class="campo">
                        <input type="email" name="login" id="ilogin" placeholder="Seu e-mail..." required maxlength="30">
                        <label for="ilogin">Login</label>
                    </div>
                    <div class="campo">
                        <input type="password" name="passwrd" id="ipasswrd" placeholder="Sua senha" required minlength="8" max="20">
                        <label for="ipasswrd">Senha</label>
                    </div>

                    <input type="submit" value="Entrar">
                    <a href="esqueci.html">
                        Esqueci a senha
                    </a>
                </form>
            </div>
        </section>
    </main>
</body>
</html>
