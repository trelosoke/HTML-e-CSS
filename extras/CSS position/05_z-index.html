<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .searchbar {
            display: inline-block;
            position: relative;
        }

        input {
            padding: 10px 20px;
            font: inherit;
            border-radius: 100px;
            border: 1px solid grey;
        }

        .button1 {
            height: 100%;
            aspect-ratio: 1 / 1;
            background-color: #0071ff;
            fill: white;
            border: none;
            border-radius: 50%;

            position: absolute;
            right: 60px;
            z-index: 10;
        }

        .button2 {
            height: 100%;
            aspect-ratio: 1 / 1;
            background-color: #00ff4c;
            fill: white;
            border: none;
            border-radius: 50%;

            position: absolute;
            right: 40px;
            z-index: 9;
        }
    </style>
</head>
<body>
    <div class="searchbar">
        <input type="text" placeholder="Search">
        <button class="button1"></button>
        <button class="button2"></button>
    </div>

    <h1>Exemplo de uso de z-index</h1>
    <p>Serve para determinar quando um elemento com position está acima do outro. valores menores / negativos em relação a outros irá fazer os elementos irem para trás de outros.</p>

    <p>Por exemplo, no "searh" acima, o botão verde tem <strong><code>z-index</code></strong> menor que o botão azul.</p>
</body>
</html>
