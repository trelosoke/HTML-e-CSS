<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo de caixas</title>
    <style>
        h1 { /* box-level */
            height: 300px;
            width: 300px;
            background-color: lightgray;

            border: 10px solid darkslategray;
            /* 
            border-width: 10px;
            border-style: solid;
            border-color: darkslategray; 
            */

            padding: 10px;
            /*
            padding-top: 10px;
            padding-right: 10px;
            padding-bottom: 10px;
            padding-left: 10px; 
            */

            margin: 10px auto 40px auto;
            /*
            margin-top: 10px;
            margin-right: auto;
            margin-bottom: 10px;
            margin-left: auto;
            */

            outline: 5px dashed blue;
            /*
            outline-width: 5px;
            outline-style: dashed;
            outline-color: blue;
            */
        }

        a { /* inline-level */
            border: 3px dashed red;
            /*
            border-width: 3px;
            border-style: dashed;
            border-color: red;
            */

            padding: 10px;
            /*
            padding-top: 10px;
            padding-right: 10px;
            padding-bottom: 10px;
            padding-left: 10px; 
            */

            outline: 5px solid blue;
            /*
            outline-width: 5px;
            outline-style: solid;
            outline-color: blue;
            */
        }
    </style>
</head>
<body>
    <h1>Exemplo de caixa box-level</h1>
    <p>Parágrafo também são exemplos de box-level. Mas os <a href="#">links são exemplos de caixas inline-level</a>.</p>
</body>
</html>
