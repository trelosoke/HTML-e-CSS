<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudos de iframe</title>
    <style>
        /* as CSS são soberanas nesse caso */
        iframe {
            border: dashed 1px black;
            width: 400px;
            height: 400px;
        }
    </style>
</head>
<body>
    <h1>Testando o uso de iframe</h1>
    <p>
        Acessando o site do 
        
        <!-- Tamanho padrão 300x150 -->
        <iframe src="https://cursoemvideo.com" frameborder="0" height="500" scrolling="no">
            <!-- 
                scrolling=""
                    yes
                    no
                    auto
            -->
            <a href="https://cursoemvideo.com" target="_blank" rel="external noopener">CursoemVideo</a>
        </iframe>

        para aprender a programar.
    </p>

    <p>
        O site do <iframe src="https://google.com.br" frameborder="0"></iframe> também é muito legal (o google é protegido, não permite).
    </p>

    <p>
        O repositório do guanabara 
        
        <iframe src="https://gustavoguanabara.github.io" frameborder="1" height="500" width="500">
            no <a href="https://gustavoguanabara.github.io" target="_blank" rel="external noopener">GitHub</a>
        </iframe>

        também é bem legal
    </p>
</body>
</html>
